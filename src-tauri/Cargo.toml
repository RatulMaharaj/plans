[package]
name = "plans"
version = "0.1.0"
description = "WYSIWYG editor for plan folders across your local git repositories"
authors = ["Ratul Maharaj"]
edition = "2021"

[lib]
name = "plans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
