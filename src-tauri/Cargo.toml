[package]
name = "plans"
version = "0.2.0"
description = "WYSIWYG editor for plan folders across your local git repositories"
authors = ["Ratul Maharaj"]
edition = "2021"

[lib]
name = "plans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
ignore = "0.4.33"

# Update in place, and relaunch afterwards. Desktop only: there is nothing to
# update on a mobile target, and neither plugin builds for one.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
