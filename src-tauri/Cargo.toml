[package]
name = "plans"
version = "0.10.0"
description = "WYSIWYG editor for plan folders across your local git repositories"
authors = ["Ratul Maharaj"]
edition = "2021"

[lib]
name = "plans_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.23.1"
ignore = "0.4.33"

# Talking to coding agents. The protocol is an open standard with an official
# SDK, which is the whole reason the app no longer builds one CLI's flags by
# hand — see plans/agent-client-protocol.md.
# The elicitation feature is what lets an agent ask *questions* (Claude's
# AskUserQuestion) as structured forms rather than prose: without the client
# capability the adapter disallows the tool entirely.
agent-client-protocol = { version = "2.0.0", features = ["unstable_elicitation"] }
tokio = { version = "1", features = ["rt", "macros", "sync", "process", "io-util", "time"] }

# The workspace server's session token lives in the OS keychain, not in
# settings.json: settings is a file the reader opens and pastes around, and a
# bearer token has no business in it. See plans/hosted-workspaces.md.
keyring = { version = "3", features = ["apple-native", "windows-native", "sync-secret-service"] }

# The development build wears a different icon, which on macOS is an AppKit
# call: `set_icon` is documented as doing nothing there, because the dock icon
# belongs to the application rather than to a window. These crates are already
# in the tree by way of tao, so this adds nothing to build or to download. The
# code that uses them is behind `debug_assertions` and never ships.
[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-app-kit = { version = "0.3", features = ["NSApplication", "NSImage", "NSResponder"] }
objc2-foundation = { version = "0.3", features = ["NSData"] }

# Update in place, and relaunch afterwards. Desktop only: there is nothing to
# update on a mobile target, and neither plugin builds for one.
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-updater = "2"
tauri-plugin-process = "2"
tauri-plugin-single-instance = "2"
