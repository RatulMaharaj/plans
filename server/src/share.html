<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>Opening…</title>
    <style>
      :root { color-scheme: light dark; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font: 15px/1.6 ui-sans-serif, -apple-system, "Segoe UI", system-ui, sans-serif;
        color: #3b3a36;
        background: #faf9f6;
      }
      @media (prefers-color-scheme: dark) {
        body { color: #d8d4cc; background: #14150f; }
      }
      p { max-width: 30rem; padding: 0 1.5rem; text-align: center; }
    </style>
  </head>
  <body>
    <p id="say">Opening this plan…</p>
    <!--
      What is left of the old share viewer.

      A link minted before plans/public-plan-pages.md is `/share#token`: the
      token rides in the fragment, which browsers never send, so the server
      cannot resolve it — this page can. It trades the token for the page the
      document now has and leaves for it, and every such link keeps working
      until the last one has expired. There is no renderer here any more; the
      page it lands on is the app's own.
    -->
    <script>
      (async () => {
        const say = (text) => (document.getElementById("say").textContent = text);
        const token = decodeURIComponent(location.hash.replace(/^#/, "")).trim();
        if (!token) return say("This link is missing its token.");
        try {
          const res = await fetch("/api/share/resolve", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ token }),
          });
          if (!res.ok) return say("This link is not a link any more.");
          const { id } = await res.json();
          // replace(), so Back goes where the reader came from rather than
          // into this redirect again.
          location.replace("/" + id);
        } catch {
          say("Could not reach the server. Try again in a moment.");
        }
      })();
    </script>
  </body>
</html>
