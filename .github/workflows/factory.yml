# The factory: a plan flipped to `ready` becomes a pull request.
# The machinery lives in RatulMaharaj/factory; this is the thin caller.
name: Factory
on:
  push:
    paths: ["plans/**"]
permissions:
  contents: write
  pull-requests: write
jobs:
  factory:
    uses: RatulMaharaj/factory/.github/workflows/dispatch.yml@main
    # Named rather than inherited: `secrets: inherit` only reaches a reusable
    # workflow under the same owner, and the factory is RatulMaharaj's while
    # this repository is loopedautomation's. Every secret the workflow declares.
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
      MUSE_API_KEY: ${{ secrets.MUSE_API_KEY }}
      FACTORY_PAT: ${{ secrets.FACTORY_PAT }}
    with:
      runner: macos-latest # matches ci.yml, so the skill's verify step can run the real suite
      verify_tools: "Bash(pnpm install:*),Bash(pnpm test:*),Bash(pnpm run:*),Bash(pnpm exec tsc:*),Bash(pnpm exec playwright:*)"
      default_model: opus
