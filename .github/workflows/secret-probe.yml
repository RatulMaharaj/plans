# Throwaway: does a secret reach a job here, and does it reach a reusable
# workflow called from here? Prints only whether each is non-empty.
name: Secret probe
on:
  push:
    branches: [impl/hosted-workspaces]
jobs:
  direct:
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "direct CLAUDE_CODE_OAUTH_TOKEN=${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}"
          echo "direct OPENAI_API_KEY=${{ secrets.OPENAI_API_KEY != '' }}"
          echo "direct FACTORY_PAT=${{ secrets.FACTORY_PAT != '' }}"
          echo "direct TAURI_SIGNING_PRIVATE_KEY=${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}"
          echo "direct MACOS_CERTIFICATE_P12_BASE64=${{ secrets.MACOS_CERTIFICATE_P12_BASE64 != '' }}"
  reusable:
    uses: RatulMaharaj/factory/.github/workflows/probe.yml@probe
    secrets: inherit
