# The workspace server as an image on GHCR, the way looped ships its services.
# Every push to main that touches the server publishes `:main` and `:sha-…`;
# a `server-vX.Y.Z` tag publishes that version. Coolify pulls by tag.
name: Server image

on:
  push:
    branches: [main]
    paths: ["server/**", "pnpm-lock.yaml", "pnpm-workspace.yaml", ".github/workflows/server-image.yml"]
    tags: ["server-v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    name: Build and push
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/plans-workspaces
          tags: |
            type=ref,event=branch
            type=sha,prefix=sha-
            type=match,pattern=server-v(.*),group=1
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: server/Dockerfile
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
