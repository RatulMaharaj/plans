name: Release

# Builds Looped Plans for macOS, signs it with the Developer ID certificate,
# notarizes it with Apple, staples the ticket, and attaches the .dmg and
# .app.tar.gz to a draft GitHub Release. A second job builds the Windows
# installer (x64, NSIS) and a third the Linux AppImage and .deb (x64), each
# attached to the same draft, so one latest.json carries all three platforms.
#
# Triggers:
#   - version tag (e.g. v0.1.0) -> full release build, draft release
#   - manual dispatch           -> build artifacts only, no release
#
# Secrets (set on this repo — Settings > Secrets and variables > Actions):
#   MACOS_CERTIFICATE_P12_BASE64  base64 of the Developer ID Application .p12
#   MACOS_CERTIFICATE_PASSWORD    password for that .p12
#   APPLE_SIGNING_IDENTITY        e.g. "Developer ID Application: Name (TEAMID)"
#   APPLE_API_KEY_ID              App Store Connect key id
#   APPLE_API_ISSUER_ID           issuer id for that key
#   APPLE_API_PRIVATE_KEY_BASE64  base64 of the .p8 private key
#   TAURI_SIGNING_PRIVATE_KEY     contents of ~/.tauri/plans.key (updater key)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  password for it (empty if none)
#
# The updater key is not the Apple one and they fail differently: Apple's
# signature says the bundle came from a known developer, the updater's says this
# archive is the one we published. Losing the updater private key is
# unrecoverable — every installed copy stops seeing updates, silently, forever.
#
# Notarization uses an App Store Connect API key rather than an Apple ID and
# app-specific password: it isn't tied to a personal account, survives 2FA
# changes, and can be revoked on its own.

on:
  workflow_dispatch:
  push:
    tags: ["v[0-9]*.[0-9]*.[0-9]*"]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build macOS
    runs-on: macos-14
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Pinned, as in ci.yml: the action refuses to guess a version, and this
      # repo has no "packageManager" field for it to read.
      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Universal binary: Apple Silicon and Intel in one bundle, so there
          # is a single download rather than an arch the user has to pick.
          targets: aarch64-apple-darwin,x86_64-apple-darwin

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Signing degrades gracefully: without credentials the build still runs
      # and produces an unsigned app, so a manual run never blocks on secrets.
      # The verify job below fails a tagged release that isn't properly signed.
      - name: Resolve signing configuration
        id: signing
        env:
          MAC_CERT: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          API_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          sign=false
          notarize=false
          [ -n "$MAC_CERT" ] && sign=true
          # Notarization needs a signed app AND the full API-key triple; asking
          # Apple to notarize an unsigned build just fails slowly.
          if [ "$sign" = true ] && [ -n "$API_KEY_ID" ] && [ -n "$API_ISSUER_ID" ] && [ -n "$API_KEY_BASE64" ]; then
            notarize=true
          fi
          echo "sign=$sign" >> "$GITHUB_OUTPUT"
          echo "notarize=$notarize" >> "$GITHUB_OUTPUT"
          echo "sign=$sign notarize=$notarize"

      - name: Warn when signing is skipped
        if: steps.signing.outputs.sign != 'true'
        run: |
          echo "::warning title=Unsigned build::No signing certificate configured — the app will be unsigned and rejected by Gatekeeper. Set MACOS_CERTIFICATE_P12_BASE64 / MACOS_CERTIFICATE_PASSWORD before distributing."

      # Tauri wants the notarization key as a file on disk, not an env value.
      # RUNNER_TEMP is wiped when the job ends and never lands in an artifact.
      - name: Stage App Store Connect key
        if: steps.signing.outputs.notarize == 'true'
        env:
          API_KEY_BASE64: ${{ secrets.APPLE_API_PRIVATE_KEY_BASE64 }}
        run: |
          printf '%s' "$API_KEY_BASE64" | base64 --decode > "$RUNNER_TEMP/apple-api-key.p8"
          chmod 600 "$RUNNER_TEMP/apple-api-key.p8"

      # The Command Line Tools linker on recent macOS runners writes proc-macro
      # dylibs with a mis-aligned LINKEDIT string pool. dyld refuses to load
      # them and the build fails with "can't find crate for serde_derive",
      # which says nothing about the real cause. rustup ships lld, which does
      # not have the bug; scripts/release-linker.mjs finds it in whichever
      # toolchain is active. Debug builds are unaffected, so this only bites in
      # release — which is to say, only here.
      - name: Use a linker that produces loadable proc-macro dylibs
        run: |
          set -euo pipefail
          SYSROOT="$(rustc --print sysroot)"
          HOST="$(rustc -vV | awk '/^host:/ { print $2 }')"
          GCC_LD="$SYSROOT/lib/rustlib/$HOST/bin/gcc-ld"
          if [ -x "$GCC_LD/ld64.lld" ]; then
            echo "RUSTFLAGS=${RUSTFLAGS:-} -C link-arg=-B$GCC_LD -C link-arg=-fuse-ld=lld" >> "$GITHUB_ENV"
          else
            echo "no bundled lld at $GCC_LD; using the system linker" >&2
          fi

      # The release body is written when the changes are made, not at publish
      # time: changesets collected them into CHANGELOG.md, and this lifts out
      # the section for the version being tagged.
      - name: Collect release notes
        id: notes
        run: |
          set -euo pipefail
          {
            echo "body<<PLANS_NOTES_EOF"
            node scripts/sync-version.mjs --notes
            echo ""
            echo "PLANS_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign, notarize
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Where the workspace server is. Baked into the build; a release
          # made without it has no workspaces.
          VITE_WORKSPACE_URL: ${{ vars.WORKSPACE_URL }}
          # tauri imports the .p12 into a temporary keychain itself.
          APPLE_CERTIFICATE: ${{ secrets.MACOS_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # Present only when notarizing — tauri skips notarization when unset.
          APPLE_API_KEY: ${{ steps.signing.outputs.notarize == 'true' && secrets.APPLE_API_KEY_ID || '' }}
          APPLE_API_ISSUER: ${{ steps.signing.outputs.notarize == 'true' && secrets.APPLE_API_ISSUER_ID || '' }}
          APPLE_API_KEY_PATH: ${{ steps.signing.outputs.notarize == 'true' && format('{0}/apple-api-key.p8', runner.temp) || '' }}
          # Signs the .app.tar.gz the updater consumes. Without these the build
          # still succeeds and simply produces no updater artifacts, which the
          # verify job below is there to catch.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          args: --target universal-apple-darwin
          # Only publish for a tag — a manual run builds artifacts to inspect
          # without creating or touching a release. The release is a DRAFT:
          # nothing reaches users until someone opens it, checks the installer,
          # and publishes.
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Looped Plans {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      # Kept even on a tagged run: the release is a draft, and having the exact
      # binaries attached to the workflow run makes it possible to inspect what
      # was built without publishing anything.
      - name: Upload installers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plans-macOS
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/universal-apple-darwin/release/bundle/dmg/*.dmg
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz
            src-tauri/target/universal-apple-darwin/release/bundle/macos/*.app.tar.gz.sig

  # Windows, x64 only for now. Its own job rather than a matrix over the one
  # above: the Apple signing steps, the linker workaround and the artifact
  # paths are all macOS-specific, and a matrix would be a page of `if:`
  # pretending two different jobs are one.
  #
  # It runs after the macOS job on purpose. Both jobs hand tauri-action the
  # same tag, and the second one to upload merges its platform into the
  # latest.json already on the draft — but two uploads at the same moment
  # would each read the feed before the other wrote it, and one platform
  # would go missing. Serial costs some minutes and removes the race.
  #
  # The installer is not Authenticode-signed: there is no certificate yet,
  # and SmartScreen will say so on first launch. The updater signature is
  # minisign, the same TAURI_SIGNING_PRIVATE_KEY as macOS, so installed
  # copies still update. See RELEASES.md, "Windows".
  build-windows:
    name: Build Windows
    needs: build
    runs-on: windows-latest
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      # Same notes as the macOS job, from the same script; bash rather than
      # PowerShell so the heredoc into GITHUB_OUTPUT reads the same way.
      - name: Collect release notes
        id: notes
        shell: bash
        run: |
          set -euo pipefail
          {
            echo "body<<PLANS_NOTES_EOF"
            node scripts/sync-version.mjs --notes
            echo ""
            echo "PLANS_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_WORKSPACE_URL: ${{ vars.WORKSPACE_URL }}
          # Signs the installer for the updater. The key is the same one
          # that signs the macOS archive: minisign, not Authenticode.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          # NSIS pinned rather than whatever "all" means on a Windows runner
          # this quarter: it bundles the WebView2 bootstrapper, updates in
          # place, and is the installer the updater handles best.
          args: --target x86_64-pc-windows-msvc --bundles nsis
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Looped Plans {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Upload installer
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plans-windows
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig

  # Linux, x64 only, as an AppImage plus a .deb. The AppImage is the artifact
  # that matters: it is the one bundle Tauri's updater can replace in place,
  # so it is what the feed's linux-x86_64 entry points at. The .deb is there
  # for the people who want one and carries no updater promise.
  #
  # Chained after the Windows job for the same reason that one waits for
  # macOS: three uploads into one latest.json have to happen one at a time,
  # or the last writer wins and a platform goes missing from the feed.
  #
  # ubuntu-22.04 rather than latest on purpose. An AppImage links against
  # the WebKitGTK it was built beside and runs on anything newer; a build on
  # a newer image would refuse to start on an older desktop. 22.04 is the
  # oldest image with the 4.1 API that Tauri 2 needs. See RELEASES.md,
  # "Linux".
  build-linux:
    name: Build Linux
    needs: build-windows
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # What Tauri 2 links on Linux: WebKitGTK 4.1 for the webview, the
      # Ayatana AppIndicator for the tray API the framework compiles in even
      # when unused, librsvg for the icons, and patchelf for the AppImage's
      # linuxdeploy step. libxdo is for the global-shortcut plugin family
      # and costs nothing to have.
      - name: Install the WebKitGTK and bundling dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libxdo-dev \
            libssl-dev \
            patchelf \
            build-essential \
            curl \
            wget \
            file

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-unknown-linux-gnu

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - run: pnpm install --frozen-lockfile

      - name: Collect release notes
        id: notes
        run: |
          set -euo pipefail
          {
            echo "body<<PLANS_NOTES_EOF"
            node scripts/sync-version.mjs --notes
            echo ""
            echo "PLANS_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VITE_WORKSPACE_URL: ${{ vars.WORKSPACE_URL }}
          # The same minisign key as the other two platforms signs the
          # AppImage for the updater; there is no distribution signature on
          # Linux to speak of.
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # linuxdeploy runs as an AppImage itself, and a runner has no FUSE
          # to mount it; this tells it to unpack instead.
          APPIMAGE_EXTRACT_AND_RUN: 1
        with:
          args: --target x86_64-unknown-linux-gnu --bundles appimage,deb
          tagName: ${{ startsWith(github.ref, 'refs/tags/v') && github.ref_name || '' }}
          releaseName: ${{ startsWith(github.ref, 'refs/tags/v') && format('Looped Plans {0}', github.ref_name) || '' }}
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false

      - name: Upload bundles
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: plans-linux
          if-no-files-found: error
          retention-days: 14
          path: |
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/appimage/*.AppImage.sig
            src-tauri/target/x86_64-unknown-linux-gnu/release/bundle/deb/*.deb

  # Signing is easy to get subtly wrong — a build can be "signed" with the
  # wrong identity, or notarized without the ticket being stapled — and the
  # symptom only shows up on a user's machine as "app is damaged". Verify the
  # real artifact with Apple's own tooling instead of trusting the build log.
  verify:
    name: Verify signature and notarization
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: macos-14
    permissions:
      # Draft releases are only visible to a token that can write them.
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plans-macOS
          path: dist

      # A release missing its updater artifacts looks completely fine — the
      # .dmg is there, signed and notarized, the notes read well, the publish
      # succeeds — and is simply invisible to every installed copy. The failure
      # has no symptom until someone asks why they never got the update.
      # Searched rather than globbed at a fixed depth: uploading several paths
      # makes upload-artifact keep the tree below their common ancestor, so
      # these arrive under dmg/ and macos/ rather than side by side.
      - name: Check the updater artifacts exist
        run: |
          set -euo pipefail
          missing=false
          for want in "*.app.tar.gz" "*.app.tar.gz.sig"; do
            if [ -z "$(find dist -name "$want" -type f)" ]; then
              echo "::error title=No updater artifact::$want is missing — this release would be invisible to installed copies. Check TAURI_SIGNING_PRIVATE_KEY and bundle.createUpdaterArtifacts."
              missing=true
            fi
          done
          [ "$missing" = false ]

      # latest.json is what an installed copy actually fetches; tauri-action
      # attaches it to the release rather than to the workflow artifact, so it
      # has to be checked on the draft itself.
      #
      # This asks as an authenticated user, because a draft's assets are not
      # readable any other way — so it proves the file is attached, not that the
      # world can read it. Anonymous readability is a property of the repository
      # rather than of a build: on a private repo every asset URL 404s for
      # everyone, and no green run here would tell you. If Looped Plans ever goes
      # private again, the updater stops working and this check stays green.
      - name: Check latest.json is on the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The job never checks out, so gh needs telling which repo it is in.
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          assets="$(gh release view "${{ github.ref_name }}" --json assets --jq '.assets[].name')"
          echo "$assets"
          if ! grep -qx "latest.json" <<< "$assets"; then
            echo "::error title=No update feed::latest.json is not attached to ${{ github.ref_name }} — installed copies will never see this release."
            exit 1
          fi

      - name: Check signature and notarization
        run: |
          set -euo pipefail
          dmg="$(find dist -name '*.dmg' -type f | head -1)"
          echo "Verifying $dmg"

          hdiutil attach "$dmg" -nobrowse -mountpoint /tmp/plans-verify
          trap 'hdiutil detach /tmp/plans-verify || true' EXIT
          app="$(ls -d /tmp/plans-verify/*.app | head -1)"

          echo "--- codesign ---"
          if ! codesign --verify --deep --strict --verbose=2 "$app"; then
            echo "::error title=Unsigned build::codesign verification failed — this build is not distributable."
            exit 1
          fi

          echo "--- gatekeeper ---"
          # spctl mirrors what a user's Mac actually does on first launch,
          # including whether the notarization ticket is stapled.
          if ! spctl --assess --type execute --verbose=4 "$app"; then
            echo "::error title=Gatekeeper rejection::spctl rejected the app — it is unsigned, or notarized without the ticket stapled."
            exit 1
          fi

          echo "Signature and notarization verified."

  # What the Windows build promises, checked: an installer, its updater
  # signature, and a windows-x86_64 entry in the feed. Nothing about
  # Authenticode, because there is none to check. Everything here is
  # file-shaped, so it needs no Windows runner; and the "is latest.json
  # attached at all" check stays in `verify` above, once, because it is a
  # fact about the release rather than about either platform.
  verify-windows:
    name: Verify Windows artifacts
    needs: build-windows
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plans-windows
          path: dist

      - name: Check the installer and its updater signature exist
        run: |
          set -euo pipefail
          missing=false
          for want in "*.exe" "*.exe.sig"; do
            if [ -z "$(find dist -name "$want" -type f)" ]; then
              echo "::error title=No Windows artifact::$want is missing — check the NSIS bundle and TAURI_SIGNING_PRIVATE_KEY."
              missing=true
            fi
          done
          [ "$missing" = false ]

      - name: Check latest.json carries windows-x86_64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "${{ github.ref_name }}" --pattern latest.json --dir feed
          jq . feed/latest.json
          if [ "$(jq -r '.platforms["windows-x86_64"].url // empty' feed/latest.json)" = "" ]; then
            echo "::error title=No Windows update entry::latest.json on ${{ github.ref_name }} has no windows-x86_64 platform — installed Windows copies will never see this release."
            exit 1
          fi

  # The Linux promise, checked: the AppImage and its updater signature, the
  # .deb, and a linux-x86_64 entry in the feed. Nothing runs the binary; that
  # is the smoke checklist in RELEASES.md and a real desktop.
  verify-linux:
    name: Verify Linux artifacts
    needs: build-linux
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: plans-linux
          path: dist

      - name: Check the AppImage, its updater signature and the .deb exist
        run: |
          set -euo pipefail
          missing=false
          for want in "*.AppImage" "*.AppImage.sig" "*.deb"; do
            if [ -z "$(find dist -name "$want" -type f)" ]; then
              echo "::error title=No Linux artifact::$want is missing — check the appimage/deb bundles and TAURI_SIGNING_PRIVATE_KEY."
              missing=true
            fi
          done
          [ "$missing" = false ]

      - name: Check latest.json carries linux-x86_64
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          gh release download "${{ github.ref_name }}" --pattern latest.json --dir feed
          jq . feed/latest.json
          if [ "$(jq -r '.platforms["linux-x86_64"].url // empty' feed/latest.json)" = "" ]; then
            echo "::error title=No Linux update entry::latest.json on ${{ github.ref_name }} has no linux-x86_64 platform — installed AppImages will never see this release."
            exit 1
          fi
