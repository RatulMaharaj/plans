name: CI

# Everything that can fail quietly: the Rust commands, the app's behaviour, and
# the performance budgets. The budgets are here because every slowdown this
# project has had was a regression rather than a slow algorithm — invisible
# until measured, and cheap to catch once it is.

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  frontend:
    name: Types, behaviour, budgets
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The version lives in four files and is bumped by one script. Automation
      # that can be bypassed by editing one file by hand is not a guarantee.
      - name: Version is the same everywhere
        run: pnpm run version:check

      # The settings schema is generated from the Settings type. A copy that
      # drifts is a schema that lies, which is worse than no schema at all.
      - name: Settings schema is current
        run: pnpm run schema:check

      - name: Types
        run: pnpm exec tsc --noEmit

      # The workspace server: real HTTP and a real websocket against an
      # in-memory database. Fast, and the app's own e2e leans on it.
      - name: Workspace server
        run: pnpm --filter plans-workspaces test

      - name: Behaviour and budgets
        run: pnpm exec playwright install --with-deps chromium && pnpm test

      # A failed budget is worth looking at rather than guessing about.
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7

  rust:
    name: Rust
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Format
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Lint
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings

      - name: Tests
        working-directory: src-tauri
        run: cargo test
