# The factory's reviewer — a second vendor, on purpose. Claude built the PR;
# Codex reviews it, so the review is independent of the model that wrote the
# code and bills the Codex subscription rather than drawing down the Claude
# one. A clean verdict plus green CI merges the PR; any finding leaves it
# open with the review posted for the human.
#
# Triggers on PRs from impl/** branches — the branch prefix the pr skill
# mandates for factory implementation branches.
#
# Auth: run `codex login` locally, then save the contents of
# ~/.codex/auth.json as the CODEX_AUTH_JSON Actions secret.
#
# Two honest notes. The review-then-merge gate is advisory, not adversarial:
# a wrong CLEAN merges the PR, so the human's oversight moves from "click
# merge" to "read what merged" — that trade was chosen deliberately. And a
# merge performed with GITHUB_TOKEN does not retrigger workflows on the base
# branch (GitHub's recursion guard): CI ran on the PR, but the base branch
# gets no fresh run of its own.
name: Factory Review

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  review:
    name: Codex reviews the diff
    # Factory PRs come two ways: impl/** branches (plan flipped on the
    # default branch) and plan branches whose PR the factory opened as the
    # github-actions bot. Human PRs from ordinary branches stay unreviewed
    # by this workflow.
    if: startsWith(github.head_ref, 'impl/') || github.event.pull_request.user.login == 'github-actions[bot]' || github.event.pull_request.user.login == 'LoopedAgent'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      verdict: ${{ steps.verdict.outputs.verdict }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Codex
        run: npm install -g @openai/codex

      - name: Restore Codex auth
        env:
          CODEX_AUTH_JSON: ${{ secrets.CODEX_AUTH_JSON }}
        run: |
          if [ -z "$CODEX_AUTH_JSON" ]; then
            echo "::error::CODEX_AUTH_JSON secret is not set — run 'codex login' locally and save ~/.codex/auth.json as the secret."
            exit 1
          fi
          mkdir -p ~/.codex
          printf '%s' "$CODEX_AUTH_JSON" > ~/.codex/auth.json

      - name: Review
        env:
          BASE: ${{ github.base_ref }}
          HEAD: ${{ github.head_ref }}
        run: |
          # danger-full-access: Codex's own sandbox (bwrap) cannot start
          # inside the runner ("bwrap: loopback: Operation not permitted"),
          # and adds nothing there anyway — the runner is an ephemeral VM
          # that is discarded after the job. The prompt keeps the review
          # read-only in intent; the VM's disposability covers the rest.
          codex exec --sandbox danger-full-access --output-last-message "$RUNNER_TEMP/review.json" \
            "You are reviewing a pull request produced by an automated agent. \
          Review the diff between origin/$BASE and origin/$HEAD (git diff origin/$BASE...origin/$HEAD) for CORRECTNESS BUGS ONLY: \
          logic errors, broken edge cases, regressions, unsafe operations, contract violations with the surrounding code. \
          Read enough of the surrounding files to judge in context. Do not report style, naming, or taste. \
          Only include findings you are confident are real; if you are unsure, leave it out. \
          Your final message must be PURE JSON, no fences, no prose around it: \
          {\"summary\": \"one-paragraph overall assessment\", \"findings\": [{\"path\": \"repo/relative/file\", \"line\": 123, \"body\": \"what breaks, with the concrete failing scenario\", \"suggestion\": \"exact replacement for that one line, only when a one-line fix is certain\"}]}. \
          line MUST be a line that appears on the new side of the diff (added or context), because the finding is posted as an inline PR comment there. \
          suggestion is optional and must be a drop-in replacement for exactly that line, matching its indentation. \
          A clean review is {\"summary\": \"...\", \"findings\": []}."

      - name: Post the review
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          n=$(node -e 'try{const r=JSON.parse(require("fs").readFileSync(process.argv[1],"utf8").replace(/^\s*```(?:json)?\s*|\s*```\s*$/g,""));console.log((r.findings??[]).length)}catch{console.log("unparsed")}' "$RUNNER_TEMP/review.json")
          if [ "$n" = "0" ]; then v=CLEAN; else v=FINDINGS; fi
          echo "verdict=$v" >> "$GITHUB_OUTPUT"
          node scripts/post-review.mjs ${{ github.event.pull_request.number }} "$RUNNER_TEMP/review.json"

  merge:
    name: Merge when clean and green
    needs: review
    if: needs.review.outputs.verdict == 'CLEAN'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      # Not `gh pr checks --watch`: that waits on every check on the head
      # SHA, including this very job — a deadlock. Watch the CI workflow
      # by name instead.
      - name: Wait for CI, then merge
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          for i in $(seq 1 56); do
            state=$(gh run list --commit "$SHA" --workflow CI --json status,conclusion \
              --jq 'if length == 0 then "waiting"
                    elif any(.[]; .status != "completed") then "running"
                    elif all(.[]; .conclusion == "success") then "success"
                    else "failure" end')
            echo "CI on $SHA: $state"
            case "$state" in
              success) break ;;
              failure) echo "::error::CI failed — not merging."; exit 1 ;;
              *) sleep 30 ;;
            esac
          done
          [ "$state" = "success" ] || { echo "::error::CI did not finish in time."; exit 1; }
          gh pr merge ${{ github.event.pull_request.number }} --squash --delete-branch
